name = "lcomly-telegram-gateway"
main = "src/index.ts"
compatibility_date = "2026-11-18"

# أنشئ namespaces ثم ضع الـ ID هنا:
# wrangler kv namespace create CHAT_KV
[[kv_namespaces]]
binding = "CHAT_KV"
id = "e1631ac1bf094ec5a642a95bed46d75a"

[vars]
# faq = رد فوري من الأسئلة الشائعة + إرسال الاستفسار للهاتف
# shadow = إرسال فقط بلا رد فوري
CHAT_MODE = "faq"
