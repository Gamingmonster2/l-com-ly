<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة — L.COM.LY</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.l.com.ly/">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230D0D0D'/><path d='M36 28 L36 72 L68 72' fill='none' stroke='%23FAFAFA' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: #fafafa; color: #0d0d0d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 32rem; width: 100%; text-align: center; }
    .mark { width: 4rem; height: 4rem; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; border-radius: 0.625rem; background: #0d0d0d; color: #fafafa; font-weight: 900; font-size: 2rem; }
    .code { font-size: 5rem; line-height: 1; font-weight: 900; color: rgba(13,13,13,.12); margin: 0 0 .5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
    p { color: rgba(13,13,13,.6); line-height: 1.8; margin: 0 0 2rem; }
    .actions { display: flex; flex-direction: column; gap: .75rem; }
    a { display: inline-block; padding: .85rem 1.25rem; border-radius: .625rem; font-weight: 700; text-decoration: none; background: #0d0d0d; color: #fafafa; }
    a.secondary { background: transparent; color: #0d0d0d; border: 1px solid rgba(13,13,13,.15); }
    @media (min-width: 640px) { .actions { flex-direction: row; justify-content: center; } }
    @media (prefers-color-scheme: dark) { body { background: #0d0d0d; color: #fafafa; } .code { color: rgba(250,250,250,.12); } p { color: rgba(250,250,250,.6); } a { background: #fafafa; color: #0d0d0d; } a.secondary { background: transparent; color: #fafafa; border-color: rgba(250,250,250,.2); } }
  </style>
</head>
<body>
  <main>
    <div class="mark">L</div>
    <p class="code">404</p>
    <h1>هذه الصفحة غير موجودة</h1>
    <p>الرابط الذي فتحته غير صحيح أو تم نقل الصفحة. لا مشكلة — نعيدك إلى المسار الصحيح.</p>
    <div class="actions">
      <a href="/">العودة للرئيسية</a>
      <a class="secondary" href="/#contact">تواصل معنا</a>
    </div>
  </main>
</body>
</html>
