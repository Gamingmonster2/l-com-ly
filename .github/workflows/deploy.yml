name: Deploy to GitHub Pages

# ملاحظة مهمة: يتطلب تفعيل Pages مرة واحدة يدوياً:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# لا يمكن تفعيله من داخل المسار: معامل enablement في configure-pages
# يحتاج توكن غير GITHUB_TOKEN (مفتاحاً شخصياً)، وهو تعقيد لا داعي له
# مقابل تغيير إعداد واحد.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: بناء وفحص
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: تثبيت الأدوات
        run: npm install --no-audit --no-fund

      - name: بناء الموقع (نسخ + Tailwind)
        run: npm run build

      - name: فحص ما قبل النشر
        run: npm run check

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: نشر
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
